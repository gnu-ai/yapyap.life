# ==============================================================================
# yAp y Ap — Interface d'administration : configuration Nginx + PHP-FPM
# (deploy/nginx/yapyap-admin.conf)
# ==============================================================================
# L'administration est servie par DEUX logiciels serveurs tiers supplémentaires :
#   - PHP-FPM : exécute les scripts PHP dans un processus distinct (FastCGI) ;
#   - Nginx    : sert les pages et transmet les *.php à PHP-FPM.
#
# L'emplacement /admin est VOLONTAIREMENT protégé :
#   1. restriction IP (seul l'administrateur s'y connecte) ;
#   2. HTTPS obligatoire (page de connexion = mot de passe qui circule).
#
# Installation :
#   cp deploy/nginx/yapyap-admin.conf /etc/nginx/sites-available/yapyap-admin
#   ln -s /etc/nginx/sites-available/yapyap-admin /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Le répertoire des fichiers PHP : /var/www/yapyap/admin
# ==============================================================================

server {
    listen 443 ssl http2;
    server_name yapyap.life;

    ssl_certificate     /etc/letsencrypt/live/yapyap.life/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yapyap.life/privkey.pem;

    # --- Interface d'administration -------------------------------------
    location /admin {
        # Restriction d'accès par adresse IP : À ADAPTER à votre connexion.
        # En local (développement) : allow 127.0.0.1 ; deny all ;
        allow 127.0.0.1;
        # allow VOTRE_IP_PUBLIQUE;
        deny all;

        root /var/www/yapyap;
        index connexion.php;

        # Transmission des scripts PHP à PHP-FPM (socket Unix local :
        # plus rapide et non exposé au réseau, esprit POSIX).
        location ~ ^/admin/.*\.php$ {
            fastcgi_pass unix:/run/php/php8.2-fpm.sock;   # adapter à votre version
            include snippets/fastcgi-php.conf;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }
    }

    # --- API applicative (déjà couvert par yapyap.conf ; rappel) ---------
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
    }

    # --- Site vitrine -----------------------------------------------------
    location / {
        root /var/www/yapyap;
        index presentation_page_index.html;
        try_files $uri $uri/ =404;
    }
}
