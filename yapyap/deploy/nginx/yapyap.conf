# ==============================================================================
# yAp y Ap — Configuration Nginx (deploy/nginx/yapyap.conf)
# ==============================================================================
# Nginx joue le rôle de PROXY INVERSE (logiciel serveur tiers) :
#   - il termine TLS (HTTPS) : certificats gérés ici, pas dans l'application ;
#   - il limite le débit des appels sensibles (anti-brute-force sur /api/auth) ;
#   - il transmet les requêtes vers l'application Rust sur 127.0.0.1:8080.
#
# Installation :
#   cp deploy/nginx/yapyap.conf /etc/nginx/sites-available/yapyap
#   ln -s /etc/nginx/sites-available/yapyap /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# ==============================================================================

# Bloc serveur HTTP : redirection permanente vers HTTPS.
server {
    listen 80;
    server_name yapyap.life www.yapyap.life;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yapyap.life www.yapyap.life;

    # Certificats (ex. Let's Encrypt — renouvelés automatiquement par
    # certbot ; l'application Rust n'a rien à connaître du TLS).
    ssl_certificate     /etc/letsencrypt/live/yapyap.life/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yapyap.life/privkey.pem;

    # Taille maximale des corps de requête, cohérente avec l'application.
    client_max_body_size 64k;

    # Anti-brute-force : 5 requêtes/seconde en moyenne sur l'authentification,
    # avec une salve tolérée de 10 (module ngx_http_limit_req).
    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
    }

    # Toutes les autres routes API : transmission telle quelle.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
    }

    # Le site vitrine (pages HTML statiques de présentation) est servi
    # DIRECTEMENT par Nginx : plus rapide, et l'application Rust n'a pas
    # à jouer le rôle de serveur de fichiers.
    location / {
        root /var/www/yapyap;
        index presentation_page_index.html;
        try_files $uri $uri/ =404;
    }
}

# Déclaration de la zone de limitation (à placer dans le contexte http,
# ou incluse depuis nginx.conf).
# limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
